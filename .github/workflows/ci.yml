name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
     - name: Conventional Commits
       uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
       with:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         allowed-commit-types: "feat,fix,cicd,chore,patch,release,test,docs,refactor,ci,dev,test"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: conventional-commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true
        env:
          GOPROXY: https://proxy.golang.org,direct
  
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      # The DynamoDB adapter tests talk to a real DynamoDB API. Without an
      # endpoint they skip, so running them here is what keeps that skip from
      # turning into a silent pass. DynamoDB Local is the lightest thing that
      # speaks the API: a few seconds to start, no AWS account.
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    # services:
    #   cassandra:
    #     image: cassandra:5 # Use a specific version if needed
    #     ports:
    #       - 9042:9042
    #     options: >-
    #       --hostname cassandra
    #       --health-cmd "cqlsh --debug -e 'DESCRIBE KEYSPACES' || exit 1"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # The CosmosDB adapter tests skip without an endpoint, like the DynamoDB
      # ones. The emulator needs a --protocol argument, which a service
      # container cannot pass, so it starts here. Pinned by digest because
      # vnext-preview is a moving tag.
      - name: Start the CosmosDB emulator
        run: |
          docker run -d -p 8081:8081 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406 \
            --protocol http
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8081/ && exit 0
            sleep 2
          done
          echo "the CosmosDB emulator did not start within 120s" >&2
          exit 1
      - name: Run tests
        # The executed-SQL tests use github.com/mattn/go-sqlite3, which is cgo.
        # Runners default to CGO_ENABLED=1, but pinning it keeps those tests
        # from silently failing to build if that default ever changes.
        env:
          CGO_ENABLED: '1'
          DYNAMODB_TEST_ENDPOINT: http://localhost:8000
          COSMOSDB_TEST_ENDPOINT: http://localhost:8081
        run: go test -v -cover ./...
        # env:
        #   CASSANDRA_HOSTS: "localhost"
        #   CASSANDRA_KEYSPACE: "testkeyspace"

